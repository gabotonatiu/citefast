<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#1b1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="360" fill="#4f46e5" opacity="0.14"/>

  <!-- Logo -->
  <g transform="translate(90,86)">
    <rect width="86" height="86" rx="22" fill="url(#accent)"/>
    <text x="43" y="48" font-family="Georgia, serif" font-weight="700" font-size="60"
          fill="#fff" text-anchor="middle" dominant-baseline="central">&#8220;</text>
    <text x="112" y="52" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700"
          font-size="44" fill="#fff">CiteFast</text>
  </g>

  <!-- Titular -->
  <text x="90" y="290" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800"
        font-size="82" fill="#ffffff" letter-spacing="-2">Citas académicas</text>
  <text x="90" y="382" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800"
        font-size="82" letter-spacing="-2">
    <tspan fill="#ffffff">perfectas en </tspan><tspan fill="url(#accent)">3 segundos</tspan>
  </text>

  <text x="92" y="452" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400"
        font-size="34" fill="#b6bccd">APA · MLA · Chicago · IEEE · Vancouver · ABNT</text>

  <!-- Badges -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="26" fill="#e2e8f0">
    <rect x="90" y="512" width="300" height="58" rx="29" fill="#ffffff" opacity="0.08"/>
    <text x="116" y="547" dominant-baseline="central">🔒 100% en tu navegador</text>
    <rect x="410" y="512" width="215" height="58" rx="29" fill="#ffffff" opacity="0.08"/>
    <text x="436" y="547" dominant-baseline="central">Open source</text>
    <rect x="645" y="512" width="165" height="58" rx="29" fill="#ffffff" opacity="0.08"/>
    <text x="671" y="547" dominant-baseline="central">Gratis</text>
  </g>
</svg>
