<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Dominio canónico: si alguien llega por *.pages.dev, se le redirige a citefast.app */
    if (location.hostname.endsWith('.pages.dev')) {
      location.replace('https://citefast.app' + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="description" content="Generador y optimizador de citas académicas gratis. Pega un DOI, ISBN, URL o título y obtén tu cita en APA 7, MLA, Chicago, IEEE, Vancouver o ABNT al instante. 100% privado, sin registro.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="author" content="Gabriel Tonatiu Andrade">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <title>CiteFast — Generador de Citas Académicas (APA, MLA, IEEE, Vancouver, ABNT)</title>
  <link rel="canonical" href="https://citefast.app/">

  <!-- Open Graph (cómo se ve al compartir) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CiteFast">
  <meta property="og:title" content="CiteFast — Generador de Citas Académicas gratis y privado">
  <meta property="og:description" content="Pega un DOI, ISBN, URL o título y obtén tu cita en APA, MLA, Chicago, IEEE, Vancouver o ABNT al instante. 100% en tu navegador, sin registro.">
  <meta property="og:url" content="https://citefast.app/">
  <meta property="og:image" content="https://citefast.app/assets/og-image.svg">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta property="og:locale:alternate" content="fr_FR">
  <meta property="og:locale:alternate" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CiteFast — Generador de Citas Académicas gratis y privado">
  <meta name="twitter:description" content="Cita en APA, MLA, Chicago, IEEE, Vancouver o ABNT al instante. 100% en tu navegador, sin registro.">
  <meta name="twitter:image" content="https://citefast.app/assets/og-image.svg">

  <!-- Iconos / PWA -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Datos estructurados: aplicación web -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "CiteFast",
    "url": "https://citefast.app/",
    "description": "Generador y optimizador de citas académicas gratis en APA 7, MLA 9, Chicago, IEEE, Vancouver y ABNT. 100% en el navegador, sin registro ni backend.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any (web browser)",
    "inLanguage": ["es", "en", "pt", "fr", "de"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "APA 7, MLA 9, Chicago, IEEE, Vancouver, ABNT",
      "Autocompletado por DOI, ISBN, URL o título",
      "Generación por lotes desde PDF/Word/texto",
      "Exportación a BibTeX, RIS y CSL-JSON"
    ],
    "author": { "@type": "Person", "name": "Gabriel Tonatiu Andrade", "url": "https://web.gabotonatiu.com" },
    "isAccessibleForFree": true
  }
  </script>

  <!-- Preconexión a las APIs para reducir latencia del autocompletado -->
  <link rel="preconnect" href="https://doi.org" crossorigin>
  <link rel="preconnect" href="https://api.crossref.org" crossorigin>
  <link rel="preconnect" href="https://api.openalex.org" crossorigin>
  <link rel="dns-prefetch" href="https://www.googleapis.com">

  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- ═══════════════════════════════════════════════════════════════════
       GOOGLE ADSENSE — pega aquí tu script del sitio (una sola vez).
       Reemplaza ca-pub-XXXXXXXXXXXXXXXX por tu ID de editor.
       Descomenta cuando tengas la cuenta aprobada:
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
       ═══════════════════════════════════════════════════════════════════ -->
</head>
<body>
  <!-- ░░░ HEADER ░░░ -->
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">❝</span>
        <span class="brand__name">Cite<b>Fast</b></span>
      </a>
      <div class="topbar__controls">
        <label class="select">
          <span class="select__label" data-i18n="langLabel">Idioma</span>
          <select id="langSelect" aria-label="Language"></select>
        </label>
        <label class="select">
          <span class="select__label" data-i18n="styleLabel">Estilo</span>
          <select id="styleSelect" aria-label="Citation style"></select>
        </label>
        <button id="themeToggle" class="icon-btn icon-btn--ghost" data-i18n-title="themeTitle" title="Tema" aria-label="Theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <!-- ░░░ HERO ░░░ -->
    <section class="hero">
      <h1 class="hero__title" id="heroTitle">Tu cita perfecta en <span>3 segundos</span></h1>
      <p class="hero__sub" id="heroSub" data-i18n="heroSub"></p>

      <div class="searchbox">
        <input id="heroInput" class="searchbox__input" type="text" autocomplete="off" spellcheck="false"
          data-i18n-ph="searchPlaceholder" placeholder="Pega un DOI, ISBN, URL o título…" aria-label="Source data">
        <button id="clearInput" class="searchbox__clear" data-i18n-title="clearTitle" title="Limpiar" aria-label="Clear">✕</button>
      </div>

      <div class="hero__meta">
        <span id="typeChip" class="chip" hidden></span>
        <span id="status" class="status status--idle"></span>
      </div>

      <p class="trust" id="trustLine">
        <span class="trust__dot" aria-hidden="true">🔒</span>
        <span data-i18n="trustLine"></span>
      </p>

      <div class="hero__cta">
        <button id="bulkOpen" class="btn btn--ghost btn--bulk" data-i18n="bulkBtn">⚡ Bulk mode</button>
      </div>

      <!-- Candidatos (desambiguación) -->
      <div id="candidates" class="candidates" hidden></div>

      <!-- Entrada manual -->
      <div class="manual">
        <button id="manualToggle" class="manual__toggle" aria-expanded="false" aria-controls="manualBody">
          <span data-i18n="manualToggle">o rellena los datos manualmente</span> <span class="manual__chevron">▾</span>
        </button>
        <div id="manualBody" class="manual__body" hidden>
          <label class="field field--wide">
            <span data-i18n="manualTypeLabel">Tipo de documento</span>
            <select id="manualType"></select>
          </label>
          <div id="manualFields" class="manual__grid"></div>
          <button id="manualBuild" class="btn btn--primary" data-i18n="manualBuild">Generar cita</button>
        </div>
      </div>
    </section>

    <!-- ░░░ VISTA PREVIA ░░░ -->
    <section id="previewCard" class="preview is-empty" aria-live="polite">
      <div class="preview__head">
        <h2 data-i18n="previewHead">Vista previa</h2>
        <span class="preview__style" id="previewStyleTag"></span>
      </div>
      <div id="previewText" class="preview__text"></div>
      <div id="previewWarnings" class="preview__warnings" hidden></div>
      <div id="previewActions" class="preview__actions" hidden>
        <button class="btn btn--primary" data-act="copy" data-i18n="actCopy">Copiar con formato</button>
        <button class="btn" data-act="copytext" data-i18n="actCopyText">Copiar texto</button>
        <button class="btn" data-act="bibtex">BibTeX</button>
        <button class="btn" data-act="ris">RIS</button>
        <button class="btn" data-act="edit" data-i18n="actEdit">Editar</button>
        <button class="btn btn--accent" data-act="add" data-i18n="actAdd">Añadir a mi biblioteca</button>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         SLOT DE ANUNCIO 1 — bloque in-content (bajo el pliegue funcional).
         Discreto, con espacio reservado para NO causar saltos de diseño (CLS=0).
         Sustituye data-ad-slot por tu slot real y descomenta el <ins>.
         ═══════════════════════════════════════════════════════════════ -->
    <aside class="ad ad--inline" aria-label="Publicidad">
      <span class="ad__tag">Ad</span>
      <div class="ad__box">
        <!--
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="0000000000"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        -->
      </div>
    </aside>

    <!-- ░░░ BIBLIOTECA ░░░ -->
    <section class="lib">
      <div class="lib__head">
        <h2><span data-i18n="libHead">Mi biblioteca</span> <span class="lib__count">(<span id="libCount">0</span>)</span></h2>
        <div id="libraryTools" class="lib__tools" hidden>
          <label class="select select--sm">
            <span class="select__label" data-i18n="exportLabel">Exportar todo</span>
            <select id="exportAll" aria-label="Export library"></select>
          </label>
          <button id="clearLibrary" class="btn btn--ghost btn--sm" data-i18n="clearLib">Vaciar</button>
        </div>
      </div>
      <p id="libraryEmpty" class="lib__empty" data-i18n="libEmpty"></p>
      <ol id="library" class="lib__list"></ol>
    </section>

    <!-- ░░░ FAQ + GUÍA DE ESTILOS ░░░ -->
    <section class="faq">
      <h2 class="faq__head" id="styleGuideHead" data-i18n="styleGuideHead">¿Qué estilo debo usar?</h2>
      <p class="faq__intro" id="styleGuideIntro" data-i18n="styleGuideIntro"></p>
      <div class="styleguide" id="styleGuideTable"></div>
      <p class="faq__tip" id="styleGuideTip" data-i18n="styleGuideTip"></p>

      <h2 class="faq__head" data-i18n="faqHead">Preguntas frecuentes</h2>
      <div id="faqList" class="faq__list"></div>
    </section>
  </main>

  <!-- ░░░ FOOTER ░░░ -->
  <footer class="footer">
    <div class="wrap footer__inner">
      <p data-i18n="footerMain"></p>
      <p class="footer__note" data-i18n="footerNote"></p>
      <p class="footer__credit">
        <span data-i18n="createdBy">Creado por</span>
        <a href="https://web.gabotonatiu.com" target="_blank" rel="noopener">Gabriel Tonatiu Andrade</a>
        · <span data-i18n="openSource">Código abierto (MIT) en</span>
        <a id="repoLink" class="gh-link" href="https://github.com/gabotonatiu/citefast" target="_blank" rel="noopener" aria-label="CiteFast en GitHub">
          <svg class="gh-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>GitHub</span>
        </a>
        · <a href="privacidad.html" data-i18n="privacyLink">Privacidad</a>
      </p>
    </div>
  </footer>

  <!-- ░░░ MODAL: selección de idioma (solo primera visita) ░░░ -->
  <div id="langModal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__box modal__box--lang" role="dialog" aria-modal="true" aria-labelledby="langModalTitle">
      <div class="modal__logo" aria-hidden="true">❝</div>
      <h2 id="langModalTitle" data-i18n="langModalTitle">Choose your language</h2>
      <p class="modal__sub" data-i18n="langModalSub"></p>
      <div id="langModalGrid" class="langgrid"></div>
    </div>
  </div>

  <!-- ░░░ MODAL: generador por lotes (bulk) ░░░ -->
  <div id="bulkModal" class="modal" hidden>
    <div class="modal__backdrop" data-bulk-close></div>
    <div class="modal__box modal__box--bulk" role="dialog" aria-modal="true" aria-labelledby="bulkTitle">
      <button class="modal__x" data-bulk-close aria-label="Close">✕</button>
      <h2 id="bulkTitle" data-i18n="bulkTitle">Bulk mode</h2>
      <p class="modal__sub" data-i18n="bulkSub"></p>

      <p class="bulk__privacy" data-i18n="bulkPrivacy"></p>

      <textarea id="bulkInput" class="bulk__input" rows="6" data-i18n-ph="bulkPastePh"></textarea>

      <div class="bulk__controls">
        <label class="btn btn--ghost bulk__file">
          <span data-i18n="bulkChoose">Choose file</span>
          <input id="bulkFile" type="file" accept=".pdf,.docx,.txt,.md,.bib,.ris,.csv" hidden>
        </label>
        <span id="bulkFileName" class="bulk__filename"></span>
        <button id="bulkAnalyze" class="btn btn--primary" data-i18n="bulkAnalyze">Extract &amp; generate</button>
      </div>

      <p class="bulk__rigor"><span aria-hidden="true">🔬</span> <span data-i18n="bulkRigor"></span></p>

      <div id="bulkStatus" class="bulk__status" hidden></div>
      <div id="bulkResults" class="bulk__results"></div>
      <div id="bulkFooter" class="bulk__footer" hidden>
        <button id="bulkAddAll" class="btn btn--accent"></button>
      </div>
    </div>
  </div>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/engine.js" defer></script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/bulk.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
